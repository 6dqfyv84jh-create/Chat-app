name: Build ChatApp APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Verify Android project
        run: |
          echo "Checking project files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/chatapp/MainActivity.kt

          echo "Project files found."

      - name: Fix Java and Kotlin JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")

          text = p.read_text()

          if "kotlinOptions" in text:
              print("Kotlin configuration already exists.")
          else:
              text += """

          kotlin {
              jvmToolchain(17)
          }

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """

              p.write_text(text)

          print("JVM configuration checked.")
          PY

      - name: Show Java version
        run: java -version

      - name: Show Gradle version
        run: gradle --version

      - name: Clean project
        run: |
          gradle clean --no-daemon

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

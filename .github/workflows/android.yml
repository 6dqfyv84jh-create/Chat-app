name: Build ChatApp APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          for dir in "." */ */*/; do
            if [ -f "$dir/settings.gradle.kts" ] &&
               [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT_DIR="${dir%/}"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            echo ""
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 4 -type f | sort

      - name: Check Gradle files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Gradle project files OK."

      - name: Check Java and Gradle
        shell: bash
        run: |
          java -version
          gradle --version

      - name: Fix JVM target
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          file = Path("app/build.gradle.kts")
          text = file.read_text()

          # Make Java compile for JVM 17
          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text = text.replace(
                  "android {",
                  """android {

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1
              )

          # Make Kotlin compile for JVM 17
          if 'jvmTarget = "17"' not in text:
              marker = "android {"
              pos = text.find(marker)

              if pos >= 0:
                  end = text.find("\n}", pos)

                  if end >= 0:
                      text = text[:end] + """

              kotlinOptions {
                  jvmTarget = "17"
              }""" + text[end:]

          file.write_text(text)

          print("JVM target configuration checked.")
          PY

          echo ""
          echo "Final app/build.gradle.kts:"
          cat app/build.gradle.kts

      - name: Clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "APK files found:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
